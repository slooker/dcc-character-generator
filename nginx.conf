server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The app is entirely static. Keep files fresh while the builder is under
    # active development, and make missing assets fail instead of silently
    # returning index.html.
    location ~* \.(?:js|css|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
